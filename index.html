<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Chill Station</title>
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Khung video nhỏ cho YouTube player - PHẢI thực sự hiển thị (không display:none / off-screen),
           vì YouTube chặn phát (lỗi 150) nếu phát hiện player bị giấu hoàn toàn khỏi màn hình. */
        .yt-mini-thumb {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 4px;
            background: #000;
        }
        .yt-mini-thumb iframe {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="bg-overlay"></div>
    <div class="dark-filter"></div>

    <!-- NÚT MỞ SETTINGS -->
    <button class="nes-btn" id="btn-open-settings">⚙️ Settings</button>

    <!-- BẢNG SETTINGS TỔNG HỢP (Ẩn mặc định) -->
    <div id="settings-modal" class="hidden">
        <div class="nes-container is-dark with-title module settings-content">
            <p class="title">Control Panel</p>
            <button class="nes-btn is-error" id="btn-close-settings">X</button>

            <div class="settings-grid">
                <!-- Cột 1: Pomodoro & Background -->
                <div class="settings-col">
                    <!-- Pomodoro -->
                    <div class="nes-container is-dark is-rounded">
                        <p style="color:#92cc41; text-align:center; margin-bottom: 5px;">Pomodoro</p>

                        <!-- Ô nhập số phút Custom -->
                        <div style="text-align: center; margin-bottom: 10px;">
                            <input type="number" id="pomo-input-minutes" class="nes-input is-dark" value="25" min="1" max="120" style="width: 80px; text-align: center; font-size: 12px; padding: 4px; height: auto;">
                            <span style="font-size: 10px;">phút</span>
                        </div>

                        <div id="timer-display">25:00</div>

                        <div class="pomo-controls">
                            <button class="nes-btn is-success nes-btn-sm" id="btn-pomo-start">Start</button>
                            <button class="nes-btn is-warning nes-btn-sm" id="btn-pomo-reset">Reset</button>
                        </div>
                    </div>

                    <!-- Background Căn Chỉnh -->
                    <div class="nes-container is-dark is-rounded" style="margin-top: 15px;">
                        <p style="color:#209cee; text-align:center; margin-bottom: 5px;">Background</p>
                        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                            <label class="nes-btn nes-btn-sm is-primary" style="flex: 1; font-size: 10px;">
                                <span>Tải ảnh/GIF</span>
                                <input type="file" id="bg-upload" accept="image/*" style="display: none;">
                            </label>
                            <button class="nes-btn nes-btn-sm is-error" id="btn-clear-bg">Reset</button>
                        </div>
                        <div class="bg-controls">
                            <p>Zoom: <span id="val-zoom">100</span>%</p>
                            <input type="range" id="slider-zoom" min="50" max="300" value="100">
                            <p>Trái - Phải: <span id="val-x">50</span>%</p>
                            <input type="range" id="slider-x" min="0" max="100" value="50">
                            <p>Lên - Xuống: <span id="val-y">50</span>%</p>
                            <input type="range" id="slider-y" min="0" max="100" value="50">
                        </div>
                    </div>
                </div>

                <!-- Cột 2: Danh sách Playlist -->
                <div class="settings-col">
                    <div class="nes-container is-dark is-rounded" style="height: 100%;">
                        <p style="color:#f7d51d; text-align:center; margin-bottom: 5px;">My Playlist</p>
                        <div class="playlist-container">
                            <ul id="playlist-ui" class="nes-list is-disc"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MINI PLAYER GÓC DƯỚI -->
    <div id="mini-player" class="nes-container is-dark is-rounded">
        <!-- Visualizer & Tên bài -->
        <div class="mini-header">
            <div id="yt-player-container" class="yt-mini-thumb"></div>
            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <p id="current-track-name">Loading...</p>
        </div>

        <!-- Điều khiển & Thanh tiến trình -->
        <div class="mini-controls">
            <button class="nes-btn mini-btn" id="btn-prev">&lt;</button>
            <button class="nes-btn is-success mini-btn-play" id="btn-play-pause">▶</button>
            <button class="nes-btn mini-btn" id="btn-next">&gt;</button>
        </div>

        <div class="mini-progress">
            <span id="time-current">00:00</span>
            <input type="range" id="progress-bar" value="0" min="0" max="100">
            <span id="time-total">00:00</span>
        </div>

        <!-- Tìm kiếm & Thêm bài -->
        <div class="mini-search">
            <input type="text" id="new-yt-id" class="nes-input is-dark" placeholder="Tìm tên bài hát...">
            <button class="nes-btn is-primary" id="btn-add-song">+</button>
        </div>
        <p id="search-status"></p>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
